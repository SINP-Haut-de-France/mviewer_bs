name: "Publish SINP HDF to sinp-hdf/sinp_hdf (manual)"

# Aucun rebuild : on republie le package de test déjà validé (release 1.0.X.XX
# de ce dépôt) sous le tag 1.0.X du dépôt cible, et on y pousse le code
# correspondant à ce tag.

on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: "Tag de test à publier (ex: 1.0.2.8). Vide = dernier tag 1.0.X.XX"
        required: false
        default: ""

env:
  TARGET_REPO: sinp-hdf/sinp_hdf
  TARGET_BRANCH: main
  ASSET_NAME: sinp_hdf.tar.gz

jobs:
  publish:
    runs-on: ubuntu-latest
    concurrency: publish-sinp-hdf
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve source tag and release tag
        id: tags
        env:
          INPUT_TAG: ${{ inputs.source_tag }}
          GH_TOKEN: ${{ secrets.GH_TOKEN_SINP_HDF }}
        run: |
          set -euo pipefail
          [ -n "${GH_TOKEN:-}" ] || { echo "::error::secret GH_TOKEN_SINP_HDF manquant"; exit 1; }
          src="${INPUT_TAG#v}"
          if [ -z "$src" ]; then
            src=$(git tag -l | grep -E '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          fi
          [ -n "$src" ] || { echo "::error::aucun tag de test 1.0.X.XX trouvé"; exit 1; }
          git rev-parse -q --verify "refs/tags/${src}" >/dev/null \
            || { echo "::error::tag ${src} introuvable"; exit 1; }
          rel=$(echo "$src" | cut -d. -f1-3)
          echo "src=${src}"  >> "$GITHUB_OUTPUT"
          echo "rel=${rel}"  >> "$GITHUB_OUTPUT"
          echo "Package de test ${src} -> release ${rel} dans ${TARGET_REPO}"

      - name: Download validated test package
        env:
          GH_TOKEN: ${{ github.token }}
          SRC: ${{ steps.tags.outputs.src }}
        run: |
          gh release download "$SRC" --repo "$GITHUB_REPOSITORY" \
            --pattern "$ASSET_NAME" --dir "$RUNNER_TEMP"
          ls -la "$RUNNER_TEMP/$ASSET_NAME"

      - name: Push apps/sinp_hdf (code du tag de test) to target repo
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN_SINP_HDF }}
          SRC: ${{ steps.tags.outputs.src }}
        run: |
          set -euo pipefail
          git checkout -q "refs/tags/${SRC}"
          git subtree split --prefix=apps/sinp_hdf -b sinp-hdf-split
          # Le dépôt cible est un miroir de apps/sinp_hdf : on écrase sa branche.
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${TARGET_REPO}.git" \
            "sinp-hdf-split:refs/heads/${TARGET_BRANCH}"

      - name: Create or update release in target repo
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN_SINP_HDF }}
          SRC: ${{ steps.tags.outputs.src }}
          REL: ${{ steps.tags.outputs.rel }}
        run: |
          set -euo pipefail
          ASSET="$RUNNER_TEMP/$ASSET_NAME"
          notes="Release ${REL} (package de test ${SRC}, source: ${GITHUB_REPOSITORY}, run ${GITHUB_RUN_ID})"
          if gh release view "$REL" --repo "$TARGET_REPO" >/dev/null 2>&1; then
            gh release upload "$REL" "$ASSET" --repo "$TARGET_REPO" --clobber
            gh release edit "$REL" --repo "$TARGET_REPO" --notes "$notes"
          else
            gh release create "$REL" "$ASSET" --repo "$TARGET_REPO" \
              --target "$TARGET_BRANCH" --title "$REL" --notes "$notes"
          fi
          echo "https://github.com/${TARGET_REPO}/releases/tag/${REL}"
