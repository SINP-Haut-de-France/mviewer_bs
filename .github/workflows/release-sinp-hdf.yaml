name: "Auto package & release SINP HDF (conservative, debug build:dist)"

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

env:
  ASSET_NAME: sinp_hdf.tar.gz

jobs:
  package-and-release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout repo (full history & tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Pre-build debug (repo state)
        run: |
          echo "GITHUB_REPOSITORY=$GITHUB_REPOSITORY"
          echo "GITHUB_REF=$GITHUB_REF"
          echo "Runner pwd: $(pwd)"
          echo "--- git status ---"
          git status --porcelain || true
          echo "--- top-level files ---"
          ls -la || true
          echo "--- apps/sinp_hdf listing (top) ---"
          ls -la apps/sinp_hdf || true
          echo "--- show package.json if present ---"
          if [ -f apps/sinp_hdf/package.json ]; then
            echo "package.json content (first 200 lines):"
            sed -n '1,200p' apps/sinp_hdf/package.json || true
          else
            echo "apps/sinp_hdf/package.json NOT FOUND"
          fi

      - name: Setup Node.js (debug)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Node/npm versions (after setup)
        run: |
          echo "node version:"; node -v || true
          echo "npm version:"; npm -v || true
          echo "which node: $(which node || true)"

      - name: Install dependencies (verbose)
        working-directory: apps/sinp_hdf
        run: |
          set -x
          echo "Working dir: $(pwd)"
          echo "Listing before npm ci:"
          ls -la
          echo "package.json present: [ -f package.json ] ->" ; [ -f package.json ] && echo "yes" || echo "no"
          npm ci --prefer-offline --no-audit --progress=false

      - name: Build (explicit, verbose, force build:dist)
        working-directory: apps/sinp_hdf
        run: |
          set -x
          echo "--- ENV before build ---"
          echo "CI=$CI"
          echo "NODE_ENV=$NODE_ENV"
          echo "BUILD_TARGET=${BUILD_TARGET:-<not-set>}"
          echo "Forcing NODE_ENV=production and BUILD_TARGET=main for the build"
          export NODE_ENV=production
          export BUILD_TARGET=main
          echo "Run: npm run build:dist (explicit)"
          npm run build:dist

      - name: Post-build debug (list outputs)
        run: |
          echo "=== After build: listing apps/sinp_hdf (depth 4) ==="
          find apps/sinp_hdf -maxdepth 4 -type f -print || true
          echo "--- du summary ---"
          du -sh apps/sinp_hdf || true
          if [ -d "apps/sinp_hdf/dist" ]; then
            echo "--- dist exists: listing ---"
            ls -la apps/sinp_hdf/dist || true
            find apps/sinp_hdf/dist -maxdepth 4 -type f -print || true
            du -sh apps/sinp_hdf/dist || true
          fi

      - name: Create archive (prefer dist/sinp_hdf, then dist, then fallback)
        run: |
          set -euo pipefail
          echo "Selecting directory to archive..."
          C1="apps/sinp_hdf/dist/sinp_hdf"
          C2="apps/sinp_hdf/dist"
          C3="apps/sinp_hdf"
          SELECTED=""
          if [ -d "$C1" ] && find "$C1" -mindepth 1 -print -quit | grep -q .; then
            SELECTED="$C1"
          elif [ -d "$C2" ] && find "$C2" -mindepth 1 -print -quit | grep -q .; then
            SELECTED="$C2"
          elif [ -d "$C3" ] && find "$C3" -mindepth 1 -print -quit | grep -q .; then
            SELECTED="$C3"
          fi
          if [ -z "$SELECTED" ]; then
            echo "::error::No build output found in expected locations: $C1, $C2, $C3"
            echo "Full recursive listing (3 levels) of apps/sinp_hdf:"
            find apps/sinp_hdf -maxdepth 3 -type f -print || true
            exit 1
          fi
          echo "Selected to archive: ${SELECTED}"
          if [ "$SELECTED" = "$C1" ]; then
            tar -czf "$GITHUB_WORKSPACE/${{ env.ASSET_NAME }}" -C "apps/sinp_hdf/dist" "sinp_hdf"
          else
            tar -czf "$GITHUB_WORKSPACE/${{ env.ASSET_NAME }}" -C "${SELECTED}" .
          fi
          echo "Archive created: $GITHUB_WORKSPACE/${{ env.ASSET_NAME }}"
          ls -la "$GITHUB_WORKSPACE/${{ env.ASSET_NAME }}"

      - name: Determine new tag from package.json and existing tags
        id: compute_tag
        run: |
          set -euo pipefail
          echo "Reading version from apps/sinp_hdf/package.json"
          version=$(node -e "console.log(require('./apps/sinp_hdf/package.json').version)")
          version="${version#v}"
          echo "package.json version: $version"
          IFS='.' read -ra parts <<< "$version"
          if [ "${#parts[@]}" -lt 3 ]; then
            echo "ERROR: package.json version must be at least MAJOR.MINOR.PATCH"
            exit 1
          fi
          base="${parts[0]}.${parts[1]}.${parts[2]}"
          echo "Base (first 3 fields): $base"
          tags=$(git ls-remote --tags origin | awk '{print $2}' | sed 's@refs/tags/@@' | sed 's@\^{}@@')
          max=-1
          for t in $tags; do
            tclean="${t#v}"
            if [ "$tclean" = "$base" ]; then
              num=0
              if [ $num -gt $max ]; then max=$num; fi
            else
              if [[ "$tclean" =~ ^${base}\.([0-9]+)$ ]]; then
                num="${BASH_REMATCH[1]}"
                if [ "$num" -gt "$max" ]; then max="$num"; fi
              fi
            fi
          done
          if [ "${#parts[@]}" -ge 4 ]; then
            last="${parts[3]}"
            if ! [[ "$last" =~ ^[0-9]+$ ]]; then
              echo "ERROR: 4th component is not numeric: $last"
              exit 1
            fi
            newnum=$((last + 1))
            newtag="${base}.${newnum}"
          else
            if [ $max -lt 0 ]; then
              newnum=1
            else
              newnum=$((max + 1))
            fi
            newtag="${base}.${newnum}"
          fi
          echo "Calculated new tag: ${newtag}"
          echo "tag=${newtag}" >> "$GITHUB_OUTPUT"

      - name: Get default branch
        id: default_branch
        run: |
          # Method 1: Try to get from remote HEAD symbolic ref
          default_branch=$(git symbolic-ref refs/remotes/origin/HEAD | sed 's@refs/remotes/origin/@@' || echo "")
          
          # Method 2: Fallback - use the repository API
          if [ -z "$default_branch" ]; then
            default_branch=$(gh repo view --json defaultBranchRef --jq '.defaultBranchRef.name')
          fi
          
          # Method 3: Final fallback - check which branch exists
          if [ -z "$default_branch" ]; then
            if git rev-parse --verify origin/main >/dev/null 2>&1; then
              default_branch="main"
            elif git rev-parse --verify origin/master >/dev/null 2>&1; then
              default_branch="master"
            else
              default_branch="main"  # Default fallback
            fi
          fi
          
          echo "Detected default branch: ${default_branch}"
          echo "default_branch=${default_branch}" >> "$GITHUB_OUTPUT"

      - name: Create annotated git tag and push
        env:
          NEW_TAG: ${{ steps.compute_tag.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "Creating tag ${NEW_TAG}"
          git tag -a "${NEW_TAG}" -m "Release ${NEW_TAG} (created by CI run ${GITHUB_RUN_ID})"
          git push origin "refs/tags/${NEW_TAG}"

      - name: Create or update versioned release and upload asset (non-destructive)
        env:
          NEW_TAG: ${{ steps.compute_tag.outputs.tag }}
          ASSET_PATH: ${{ github.workspace }}/${{ env.ASSET_NAME }}
          DEFAULT_BRANCH: ${{ steps.default_branch.outputs.default_branch }}
        run: |
          set -euo pipefail
          echo "Creating or updating release ${NEW_TAG} targeting ${DEFAULT_BRANCH}"
          echo "Asset path: ${ASSET_PATH}"
          if [ ! -f "${ASSET_PATH}" ]; then
            echo "::error::Asset file not found at ${ASSET_PATH}"
            exit 1
          fi
          if gh release view "${NEW_TAG}" >/dev/null 2>&1; then
            echo "Release ${NEW_TAG} exists - attempting upload"
            if gh release upload "${NEW_TAG}" "${ASSET_PATH}" --clobber; then
              echo "Uploaded asset to ${NEW_TAG}"
            else
              echo "::warning::Upload to ${NEW_TAG} failed (immutable or permission). No destructive action will be taken."
            fi
          else
            if gh release create "${NEW_TAG}" --target "${DEFAULT_BRANCH}" --title "${NEW_TAG}" --notes "Release ${NEW_TAG} (auto-created by CI)" "${ASSET_PATH}"; then
              echo "Release ${NEW_TAG} created with asset"
            else
              echo "::warning::Failed to create release ${NEW_TAG}. Attempting upload if release exists"
              if gh release upload "${NEW_TAG}" "${ASSET_PATH}" --clobber; then
                echo "Uploaded asset to ${NEW_TAG}"
              else
                echo "::warning::upload still failed. Manual intervention may be required."
              fi
            fi
          fi

      - name: Update persistent 'Release_latest' release (conservative, non-destructive)
        env:
          ASSET_PATH: ${{ github.workspace }}/${{ env.ASSET_NAME }}
          NEW_TAG: ${{ steps.compute_tag.outputs.tag }}
          DEFAULT_BRANCH: ${{ steps.default_branch.outputs.default_branch }}
        run: |
          set -euo pipefail
          echo "Attempting to update 'Release_latest' release with asset ${ASSET_PATH}"
          echo "Asset path: ${ASSET_PATH}"
          if [ ! -f "${ASSET_PATH}" ]; then
            echo "::error::Asset file not found at ${ASSET_PATH}"
            exit 1
          fi
          if gh release view "Release_latest" >/dev/null 2>&1; then
            echo "Release 'Release_latest' exists - attempting upload (non-destructive)"
            if gh release upload "Release_latest" "${ASSET_PATH}" --clobber; then
              echo "Uploaded asset to 'Release_latest' successfully"
              gh release edit "Release_latest" --notes "Latest asset updated from release ${NEW_TAG} (workflow ${GITHUB_RUN_ID})" || true
            else
              echo "::warning::Cannot upload to 'Release_latest' (permission denied). Manual intervention required to update the 'Release_latest' release asset."
            fi
          else
            echo "'Release_latest' release not found — creating it targeting ${DEFAULT_BRANCH} (non-destructive: create only)"
            if gh release create "Release_latest" --target "${DEFAULT_BRANCH}" --title "Release Latest" --notes "Persistent 'Release_latest' release created by CI (source ${NEW_TAG})" "${ASSET_PATH}"; then
              echo "'Release_latest' created and asset uploaded"
            else
              echo "::warning::Failed to create 'Release_latest' release. Likely permissions or invalid target branch. Manual intervention required."
            fi
          fi

      - name: Print final URLs and summary
        env:
          NEW_TAG: ${{ steps.compute_tag.outputs.tag }}
        run: |
          echo "Release tag created: ${NEW_TAG}"
          echo "Versioned download URL (asset): https://github.com/${GITHUB_REPOSITORY}/releases/download/${NEW_TAG}/${{ env.ASSET_NAME }}"
          echo "Persistent Release_latest download URL: https://github.com/${GITHUB_REPOSITORY}/releases/download/Release_latest/${{ env.ASSET_NAME }}"