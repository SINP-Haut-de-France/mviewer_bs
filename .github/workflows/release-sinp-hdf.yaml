name: "Auto package & release SINP HDF (conservative, non-destructive)"

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

env:
  ASSET_NAME: sinp_hdf.tar.gz

jobs:
  package-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (full history & tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/sinp_hdf/package-lock.json

      - name: Install dependencies
        working-directory: apps/sinp_hdf
        run: npm ci

      - name: Build SINP HDF package
        working-directory: apps/sinp_hdf
        run: npm run build

      - name: Create archive (content of apps/sinp_hdf only)
        run: |
          echo "Workspace: $GITHUB_WORKSPACE"
          if [ -d "$GITHUB_WORKSPACE/apps/sinp_hdf" ]; then
            tar -czf "$GITHUB_WORKSPACE/${ASSET_NAME}" -C "$GITHUB_WORKSPACE/apps/sinp_hdf" .
            echo "Created archive:"
            ls -la "$GITHUB_WORKSPACE/${ASSET_NAME}"
          else
            echo "ERROR: apps/sinp_hdf directory not found"
            ls -la "$GITHUB_WORKSPACE" || true
            exit 1
          fi

      - name: Determine new tag from package.json and existing tags
        id: compute_tag
        run: |
          set -euo pipefail
          version=$(node -e "console.log(require('./apps/sinp_hdf/package.json').version)")
          version="${version#v}"
          echo "package.json version: $version"
          IFS='.' read -ra parts <<< "$version"
          if [ "${#parts[@]}" -lt 3 ]; then
            echo "ERROR: package.json version must be at least MAJOR.MINOR.PATCH"
            exit 1
          fi
          base="${parts[0]}.${parts[1]}.${parts[2]}"
          echo "Base: $base"
          tags=$(git ls-remote --tags origin | awk '{print $2}' | sed 's@refs/tags/@@' | sed 's@\^{}@@')
          max=-1
          for t in $tags; do
            tclean="${t#v}"
            if [ "$tclean" = "$base" ]; then
              num=0
              if [ $num -gt $max ]; then max=$num; fi
            else
              if [[ "$tclean" =~ ^${base}\.([0-9]+)$ ]]; then
                num="${BASH_REMATCH[1]}"
                if [ "$num" -gt "$max" ]; then max="$num"; fi
              fi
            fi
          done
          if [ "${#parts[@]}" -ge 4 ]; then
            last="${parts[3]}"
            if ! [[ "$last" =~ ^[0-9]+$ ]]; then
              echo "ERROR: 4th component not numeric: $last"
              exit 1
            fi
            newnum=$((last + 1))
            newtag="${base}.${newnum}"
          else
            if [ $max -lt 0 ]; then
              newnum=1
            else
              newnum=$((max + 1))
            fi
            newtag="${base}.${newnum}"
          fi
          echo "tag=${newtag}" >> "$GITHUB_OUTPUT"

      - name: Create annotated git tag and push
        env:
          NEW_TAG: ${{ steps.compute_tag.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "Creating and pushing tag ${NEW_TAG}"
          git tag -a "${NEW_TAG}" -m "Release ${NEW_TAG} (created by CI ${GITHUB_RUN_ID})"
          git push origin "refs/tags/${NEW_TAG}"

      - name: Create or update versioned release and upload asset (non-destructive)
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_TAG: ${{ steps.compute_tag.outputs.tag }}
          ASSET_PATH: ${{ github.workspace }}/${{ env.ASSET_NAME }}
        run: |
          set -euo pipefail
          echo "Creating release ${NEW_TAG} or uploading asset if already exists"
          # Try to create the release with asset in one command
          if gh release view "${NEW_TAG}" >/dev/null 2>&1; then
            echo "Release ${NEW_TAG} already exists - attempt upload"
            if gh release upload "${NEW_TAG}" "${ASSET_PATH}" --clobber; then
              echo "Uploaded asset to ${NEW_TAG}"
            else
              echo "Warning: upload to ${NEW_TAG} failed (immutable or permission). No destructive action will be taken."
            fi
          else
            # create release and include the asset
            if gh release create "${NEW_TAG}" --target main --title "${NEW_TAG}" --notes "Release ${NEW_TAG} (auto-created by CI)" "${ASSET_PATH}"; then
              echo "Release ${NEW_TAG} created with asset"
            else
              echo "Warning: failed to create release ${NEW_TAG}. Attempting to upload if release exists."
              if gh release upload "${NEW_TAG}" "${ASSET_PATH}" --clobber; then
                echo "Uploaded asset to ${NEW_TAG}"
              else
                echo "Warning: upload still failed. No destructive action will be taken."
              fi
            fi
          fi

      - name: Update persistent 'Latest' release (conservative)
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_PATH: ${{ github.workspace }}/${{ env.ASSET_NAME }}
          NEW_TAG: ${{ steps.compute_tag.outputs.tag }}
        run: |
          set -euo pipefail
          echo "Attempting to update 'Latest' release with asset ${ASSET_PATH}"
          if gh release view "Latest" >/dev/null 2>&1; then
            echo "Release 'Latest' exists - attempting upload (non-destructive)"
            if gh release upload "Latest" "${ASSET_PATH}" --clobber; then
              echo "Uploaded asset to 'Latest' successfully"
              gh release edit "Latest" --notes "Latest asset updated from release ${NEW_TAG} (workflow ${GITHUB_RUN_ID})" || true
            else
              echo "::warning::Cannot upload to 'Latest' (immutable or permission denied). Manual intervention required to update the 'Latest' release asset."
              # do not delete or recreate — conservative policy: stop here
            fi
          else
            echo "'Latest' release not found — creating it (non-destructive in the sense we only create when absent)"
            if gh release create "Latest" --target main --title "Latest" --notes "Persistent 'Latest' release created by CI (source ${NEW_TAG})" "${ASSET_PATH}"; then
              echo "'Latest' created and asset uploaded"
            else
              echo "::warning::Failed to create 'Latest' release. Manual intervention required."
            fi
          fi

      - name: Print final URLs and summary
        env:
          NEW_TAG: ${{ steps.compute_tag.outputs.tag }}
          ASSET_NAME: ${{ env.ASSET_NAME }}
        run: |
          echo "Release tag created: ${NEW_TAG}"
          echo "Versioned download URL (asset): https://github.com/${GITHUB_REPOSITORY}/releases/download/${NEW_TAG}/${ASSET_NAME}"
          echo "Persistent Latest download URL: https://github.com/${GITHUB_REPOSITORY}/releases/download/Latest/${ASSET_NAME}"