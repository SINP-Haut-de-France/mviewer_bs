name: "Package SINP HDF release"

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach the SINP HDF package to"
        required: true

permissions:
  contents: write

jobs:
  package-sinp-hdf:
    runs-on: ubuntu-latest
    if: github.repository == 'SINP-Haut-de-France/mviewer_bs'

    env:
      ASSET_NAME: sinp_hdf.tar.gz

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/sinp_hdf/package-lock.json

      - name: "Install dependencies"
        working-directory: apps/sinp_hdf
        run: npm ci

      - name: "Build SINP HDF package"
        working-directory: apps/sinp_hdf
        run: npm run build

      - name: "Create archive (content of apps/sinp_hdf only)"
        run: |
          echo "Workspace: $GITHUB_WORKSPACE"
          ls -la "$GITHUB_WORKSPACE" || true
          if [ -d "$GITHUB_WORKSPACE/apps/sinp_hdf" ]; then
            tar -czf "$GITHUB_WORKSPACE/${ASSET_NAME}" -C "$GITHUB_WORKSPACE/apps/sinp_hdf" .
            echo "Created archive:"
            ls -la "$GITHUB_WORKSPACE/${ASSET_NAME}"
          else
            echo "ERROR: apps/sinp_hdf directory not found"
            ls -la "$GITHUB_WORKSPACE" || true
            exit 1
          fi

      - name: "Determine release tag"
        id: get_tag
        run: |
          # priority: release event tag_name, otherwise workflow_dispatch input
          if [ -n "${{ github.event.release.tag_name }}" ]; then
            echo "tag=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ inputs.tag }}" >> $GITHUB_OUTPUT
          fi

      - name: "Ensure versioned release exists (fallback)"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.get_tag.outputs.tag }}
        run: |
          # If release doesn't exist for the tag, create it (target master). Usually release exists when triggered by release event.
          if ! gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} not found — creating draft targetting 'master'"
            gh release create "${RELEASE_TAG}" --target main --notes "Release ${RELEASE_TAG} (auto-created by CI)" || true
          else
            echo "Release ${RELEASE_TAG} exists"
          fi

      - name: "Upload package to versioned release"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.get_tag.outputs.tag }}
        run: |
          echo "Uploading ${ASSET_NAME} to release ${RELEASE_TAG}"
          gh release upload "${RELEASE_TAG}" "$GITHUB_WORKSPACE/${ASSET_NAME}" --clobber

      - name: "Upload package to persistent 'Latest' release (fixed URL)"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.get_tag.outputs.tag }}
          ASSET_NAME: ${{ env.ASSET_NAME }}
        run: |
          # Goal: keep a release named "Latest" that always contains the most recent asset.
          if gh release view "Latest" >/dev/null 2>&1; then
            echo "Uploading ${ASSET_NAME} to existing release 'Latest'"
            gh release upload "Latest" "$GITHUB_WORKSPACE/${ASSET_NAME}" --clobber
            # update notes to reference the versioned release for traceability
            gh release edit "Latest" --notes "Latest asset updated from release ${RELEASE_TAG} (uploaded by workflow run ${GITHUB_RUN_ID})" || true
          else
            echo "Release 'Latest' not found — creating it pointing to 'main' and uploading asset"
            gh release create "Latest" --target main --notes "Persistent release for Latest asset. Initially created by CI." || true
            gh release upload "Latest" "$GITHUB_WORKSPACE/${ASSET_NAME}" --clobber
            gh release edit "Latest" --notes "Latest asset created from release ${RELEASE_TAG} (workflow run ${GITHUB_RUN_ID})" || true
          fi

      - name: "Verification (list release assets)"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.get_tag.outputs.tag }}
        run: |
          echo "Assets for ${RELEASE_TAG}:"
          gh release view "${RELEASE_TAG}" --json assets -q '.assets[].name' || true
          echo "Assets for Latest:"
          gh release view "Latest" --json assets -q '.assets[].name' || true