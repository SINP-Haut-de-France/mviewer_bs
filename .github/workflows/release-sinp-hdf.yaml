name: "Auto package & release SINP HDF (conservative, dynamic default branch)"

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

env:
  ASSET_NAME: sinp_hdf.tar.gz

jobs:
  package-and-release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout repository (full history & tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Determine repository default branch
        id: default_branch
        run: |
          DEFAULT=$(gh api -H "Accept: application/vnd.github+json" /repos/${GITHUB_REPOSITORY} --jq .default_branch)
          echo "default_branch=${DEFAULT}" >> $GITHUB_OUTPUT
          echo "Default branch: ${DEFAULT}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/sinp_hdf/package-lock.json

      - name: Install dependencies
        working-directory: apps/sinp_hdf
        run: npm ci

      - name: Build SINP HDF package
        working-directory: apps/sinp_hdf
        run: npm run build

      - name: Create archive (prefer dist/sinp_hdf, then dist, then fallback)
        run: |
          set -euo pipefail
          echo "Workspace: $GITHUB_WORKSPACE"
          echo "Listing apps/sinp_hdf:"
          ls -la "$GITHUB_WORKSPACE/apps/sinp_hdf" || true

          # candidates in order of preference
          C1="apps/sinp_hdf/dist/sinp_hdf"
          C2="apps/sinp_hdf/dist"
          C3="apps/sinp_hdf"

          SELECTED=""
          if [ -d "$GITHUB_WORKSPACE/$C1" ] && find "$GITHUB_WORKSPACE/$C1" -mindepth 1 | read -r; then
            SELECTED="$C1"
          elif [ -d "$GITHUB_WORKSPACE/$C2" ] && find "$GITHUB_WORKSPACE/$C2" -mindepth 1 | read -r; then
            SELECTED="$C2"
          elif [ -d "$GITHUB_WORKSPACE/$C3" ] && find "$GITHUB_WORKSPACE/$C3" -mindepth 1 | read -r; then
            SELECTED="$C3"
          fi

          if [ -z "$SELECTED" ]; then
            echo "::error::No build output found in expected locations: $C1, $C2, $C3"
            echo "Full listing (3 levels) of apps/sinp_hdf:"
            find "$GITHUB_WORKSPACE/apps/sinp_hdf" -maxdepth 3 -type f -print || true
            exit 1
          fi

          echo "Selected directory to archive: $SELECTED"
          # If selected is apps/sinp_hdf/dist/sinp_hdf we want to archive that directory itself (so tar -C dist sinp_hdf)
          if [ "$SELECTED" = "$C1" ]; then
            tar -czf "$GITHUB_WORKSPACE/${ASSET_NAME}" -C "$GITHUB_WORKSPACE/apps/sinp_hdf/dist" "sinp_hdf"
          else
            tar -czf "$GITHUB_WORKSPACE/${ASSET_NAME}" -C "$GITHUB_WORKSPACE/$SELECTED" .
          fi
          echo "Created archive:"
          ls -la "$GITHUB_WORKSPACE/${ASSET_NAME}"

      - name: Determine new tag from package.json and existing tags
        id: compute_tag
        run: |
          set -euo pipefail
          echo "Reading version from apps/sinp_hdf/package.json"
          version=$(node -e "console.log(require('./apps/sinp_hdf/package.json').version)")
          version="${version#v}"
          echo "package.json version: $version"
          IFS='.' read -ra parts <<< "$version"
          if [ "${#parts[@]}" -lt 3 ]; then
            echo "ERROR: package.json version must be at least MAJOR.MINOR.PATCH"
            exit 1
          fi
          base="${parts[0]}.${parts[1]}.${parts[2]}"
          tags=$(git ls-remote --tags origin | awk '{print $2}' | sed 's@refs/tags/@@' | sed 's@\^{}@@')
          max=-1
          for t in $tags; do
            tclean="${t#v}"
            if [ "$tclean" = "$base" ]; then
              num=0
              if [ $num -gt $max ]; then max=$num; fi
            else
              if [[ "$tclean" =~ ^${base}\.([0-9]+)$ ]]; then
                num="${BASH_REMATCH[1]}"
                if [ "$num" -gt "$max" ]; then max="$num"; fi
              fi
            fi
          done
          if [ "${#parts[@]}" -ge 4 ]; then
            last="${parts[3]}"
            if ! [[ "$last" =~ ^[0-9]+$ ]]; then
              echo "ERROR: 4th component is not numeric: $last"
              exit 1
            fi
            newnum=$((last + 1))
            newtag="${base}.${newnum}"
          else
            if [ $max -lt 0 ]; then
              newnum=1
            else
              newnum=$((max + 1))
            fi
            newtag="${base}.${newnum}"
          fi
          echo "tag=${newtag}" >> "$GITHUB_OUTPUT"
          echo "Calculated new tag: ${newtag}"

      - name: Create annotated git tag and push
        env:
          NEW_TAG: ${{ steps.compute_tag.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${NEW_TAG}" -m "Release ${NEW_TAG} (created by CI run ${GITHUB_RUN_ID})"
          git push origin "refs/tags/${NEW_TAG}"

      - name: Create or update versioned release and upload asset (non-destructive)
        env:
          NEW_TAG: ${{ steps.compute_tag.outputs.tag }}
          ASSET_PATH: ${{ github.workspace }}/$ASSET_NAME
          DEFAULT_BRANCH: ${{ steps.default_branch.outputs.default_branch }}
        run: |
          set -euo pipefail
          echo "Creating or updating release ${NEW_TAG} targeting ${DEFAULT_BRANCH}"
          if gh release view "${NEW_TAG}" >/dev/null 2>&1; then
            echo "Release ${NEW_TAG} exists - attempting upload"
            if gh release upload "${NEW_TAG}" "${ASSET_PATH}" --clobber; then
              echo "Uploaded asset to ${NEW_TAG}"
            else
              echo "::warning::Upload to ${NEW_TAG} failed (immutable or permission). No destructive action will be taken."
            fi
          else
            if gh release create "${NEW_TAG}" --target "${DEFAULT_BRANCH}" --title "${NEW_TAG}" --notes "Release ${NEW_TAG} (auto-created by CI)" "${ASSET_PATH}"; then
              echo "Release ${NEW_TAG} created with asset"
            else
              echo "::warning::Failed to create release ${NEW_TAG}. Attempting upload if release exists"
              if gh release upload "${NEW_TAG}" "${ASSET_PATH}" --clobber; then
                echo "Uploaded asset to ${NEW_TAG}"
              else
                echo "::warning::upload still failed. Manual intervention may be required."
              fi
            fi
          fi

      - name: Update persistent 'Latest' release (conservative, non-destructive)
        env:
          ASSET_PATH: ${{ github.workspace }}/$ASSET_NAME
          NEW_TAG: ${{ steps.compute_tag.outputs.tag }}
          DEFAULT_BRANCH: ${{ steps.default_branch.outputs.default_branch }}
        run: |
          set -euo pipefail
          echo "Attempting to update 'Latest' release with asset ${ASSET_PATH}"
          if gh release view "Latest" >/dev/null 2>&1; then
            echo "Release 'Latest' exists - attempting upload (non-destructive)"
            if gh release upload "Latest" "${ASSET_PATH}" --clobber; then
              echo "Uploaded asset to 'Latest' successfully"
              gh release edit "Latest" --notes "Latest asset updated from release ${NEW_TAG} (workflow ${GITHUB_RUN_ID})" || true
            else
              echo "::warning::Cannot upload to 'Latest' (immutable or permission denied). Manual intervention required to update the 'Latest' release asset."
            fi
          else
            echo "'Latest' release not found — creating it targeting ${DEFAULT_BRANCH} (non-destructive: create only)"
            if gh release create "Latest" --target "${DEFAULT_BRANCH}" --title "Latest" --notes "Persistent 'Latest' release created by CI (source ${NEW_TAG})" "${ASSET_PATH}"; then
              echo "'Latest' created and asset uploaded"
            else
              echo "::warning::Failed to create 'Latest' release. Likely permissions or invalid target branch. Manual intervention required."
            fi
          fi

      - name: Print final URLs and summary
        env:
          NEW_TAG: ${{ steps.compute_tag.outputs.tag }}
          ASSET_NAME: ${{ env.ASSET_NAME }}
        run: |
          echo "Release tag created: ${NEW_TAG}"
          echo "Versioned download URL (asset): https://github.com/${GITHUB_REPOSITORY}/releases/download/${NEW_TAG}/${ASSET_NAME}"
          echo "Persistent Latest download URL: https://github.com/${GITHUB_REPOSITORY}/releases/download/Latest/${ASSET_NAME}"