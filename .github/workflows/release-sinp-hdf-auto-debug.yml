name: "Auto package & release SINP HDF (conservative, debug verbose)"

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

env:
  ASSET_NAME: sinp_hdf.tar.gz

jobs:
  package-and-release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout repo (full history & tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Pre-build debug (repo state)
        run: |
          echo "GITHUB_REPOSITORY=$GITHUB_REPOSITORY"
          echo "GITHUB_REF=$GITHUB_REF"
          echo "Runner pwd: $(pwd)"
          echo "--- git status ---"
          git status --porcelain || true
          echo "--- top-level files ---"
          ls -la || true
          echo "--- apps/sinp_hdf listing (top) ---"
          ls -la apps/sinp_hdf || true
          echo "--- show package.json if present ---"
          if [ -f apps/sinp_hdf/package.json ]; then
            echo "package.json content:"
            sed -n '1,200p' apps/sinp_hdf/package.json || true
          else
            echo "apps/sinp_hdf/package.json NOT FOUND"
          fi

      - name: Setup Node.js (debug)
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Node/npm versions (after setup)
        run: |
          echo "node version:"
          node -v || true
          echo "npm version:"
          npm -v || true
          echo "which node: $(which node || true)"

      - name: Install dependencies (verbose)
        working-directory: apps/sinp_hdf
        run: |
          set -x
          echo "Working dir: $(pwd)"
          ls -la || true
          echo "package.json exists: [ -f package.json ] ->" ; [ -f package.json ] && echo "yes" || echo "no"
          npm ci

      - name: Build (verbose)
        working-directory: apps/sinp_hdf
        run: |
          set -x
          echo "Running npm run build in $(pwd)"
          npm run build

      - name: Post-build debug (list outputs)
        run: |
          echo "=== After build: listing apps/sinp_hdf (depth 3) ==="
          find apps/sinp_hdf -maxdepth 3 -type f -print || true
          echo "du -sh apps/sinp_hdf/* (summaries):"
          du -sh apps/sinp_hdf/* || true